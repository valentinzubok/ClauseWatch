name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r requirements-dev.txt
      - name: Format check
        run: black --check contracts tests
      - name: Lint
        run: flake8 contracts tests --max-line-length=100 --ignore=E501,W503,E402,F403,F405
      - name: Contract tests
        run: python3 -m pytest -q

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is the console present on this ref?
        id: probe
        run: test -f web/package-lock.json && echo "present=true" >> "$GITHUB_OUTPUT" || echo "present=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.probe.outputs.present == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.probe.outputs.present == 'true'
        working-directory: web
        run: npm ci
      - name: Typecheck
        if: steps.probe.outputs.present == 'true'
        working-directory: web
        run: npx tsc --noEmit
      - name: Build static export
        if: steps.probe.outputs.present == 'true'
        working-directory: web
        run: npm run build
